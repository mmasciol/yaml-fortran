# https://docs.docker.com/ci-cd/github-actions/
# https://github.com/docker/build-push-action/issues/225

name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mdmasciola/gh-yaml-fortran:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: pre-build
        run: apt-get update
      - name: build
        run: make install-dependencies
      - name: compile
        run: make compile-yaml-fortran
      - name: archive binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
          retention-days: 1
      - name: archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*
          retention-days: 1

  test:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: mdmasciola/gh-yaml-fortran:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: test execution
        run: |
          chmod +x ./bin/*
          make test-execution
      - name: test memory leaks
        run: |
          chmod +x ./bin/*
          make test-memory-check

  test-coverage-report:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: mdmasciola/gh-yaml-fortran:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: build coverage report
        run: |
          chmod +x ./bin/*
          make coverage-report
      - name: archive coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage/*
          retention-days: 7
      - name: coverage report badge
        uses: codecov/codecov-action@v2
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true

  documentation:
    needs: [test-coverage-report]
    runs-on: ubuntu-latest
    container:
      image: mdmasciola/gh-yaml-fortran:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: patch mkdocs-fortran for markdown 3
        run: |
          patch_file="${GITHUB_WORKSPACE}/.github/patches/mkdocs-fortran-markdown3.patch"
          if git -C pkg/mkdocs-fortran apply --check "${patch_file}"; then
            git -C pkg/mkdocs-fortran apply "${patch_file}"
          fi
      - name: build documentation
        run: |
          . /.ci-venv/bin/activate
          pip install -r requirements.txt
          make documentation
      - name: archive documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: _docs
          path: _docs/*
          retention-days: 1

  deploy-documentation:
    needs: [documentation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: _docs
          path: _docs
      - name: configure credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: deploy static site to bucket
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: |
          test -n "${SITE_BUCKET}"
          aws s3 sync ./_docs/ "s3://${SITE_BUCKET}" --delete
      - name: invalidate cloudfront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "${CLOUDFRONT_DISTRIBUTION_ID}"
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
